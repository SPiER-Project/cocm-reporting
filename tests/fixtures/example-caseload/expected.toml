# What the calculator must produce from this fixture, for March 2025.
# The worked example is docs/guide/example-caseload.md; the metric pages quote it.
# Percentages and weeks are computed from these counts by scripts/examples.py, using the
# rounding rule in rules/calls.toml, so only the counts are stated here.

reporting_month = "2025-03"

[metrics.m1]
count = 9
[metrics.m2]
count = 8
[metrics.m3]
count = 1
[metrics.m4]
discharged_days = [160, 102]          # P4 (inactivity), P9 (graduated)
[metrics.m5]
numerator = 7
denominator = 8
[metrics.m6]
numerator = 4
denominator = 6
[metrics.m7]
numerator = 2
denominator = 8
[metrics.m8]
numerator = 1
denominator = 2

